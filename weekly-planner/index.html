<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: nutzt das volle Display inkl. Bereich um die Dynamic Island -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="Lokaler Wochenplaner mit automatischer Planung nach Wichtigkeit." />

  <!-- iOS: als Vollbild-App vom Home-Bildschirm starten -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Planer" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Wochenplaner</title>
</head>
<body>
  <div id="app">
    <!-- Kopfbereich -->
    <header class="topbar">
      <div class="topbar__row">
        <div>
          <p class="topbar__eyebrow" id="todayLabel">Heute</p>
          <h1 class="topbar__title">Wochenplaner</h1>
        </div>
        <button class="icon-btn" id="weekPrev" aria-label="Vorherige Woche">‹</button>
        <div class="week-switch">
          <span id="weekRange">Diese Woche</span>
        </div>
        <button class="icon-btn" id="weekNext" aria-label="Nächste Woche">›</button>
      </div>

      <!-- Übersichts-Kennzahlen -->
      <div class="stats" id="stats">
        <div class="stat"><span class="stat__num" id="statOpen">0</span><span class="stat__label">offen</span></div>
        <div class="stat"><span class="stat__num" id="statDone">0</span><span class="stat__label">erledigt</span></div>
        <div class="stat"><span class="stat__num" id="statLoad">0h</span><span class="stat__label">geplant</span></div>
      </div>

      <!-- Tagesnavigation (Mo–So) -->
      <nav class="daynav" id="daynav"></nav>
    </header>

    <!-- Plan-Ansicht -->
    <main class="content" id="content"></main>

    <!-- Schwebender Hinzufügen-Button -->
    <button class="fab" id="addBtn" aria-label="Aufgabe hinzufügen">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Eingabe-Dialog für neue/zu bearbeitende Aufgaben -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet__grip"></div>
      <h2 class="sheet__title" id="sheetTitle">Neue Aufgabe</h2>

      <label class="field">
        <span class="field__label">Aufgabe</span>
        <input type="text" id="fTitle" placeholder="z. B. Präsentation vorbereiten" autocomplete="off" />
      </label>

      <div class="field">
        <span class="field__label">Wichtigkeit</span>
        <div class="seg" id="fImportance" role="radiogroup" aria-label="Wichtigkeit">
          <button type="button" data-val="1">Niedrig</button>
          <button type="button" data-val="2">Normal</button>
          <button type="button" data-val="3" class="is-active">Hoch</button>
          <button type="button" data-val="4">Sehr hoch</button>
          <button type="button" data-val="5">Kritisch</button>
        </div>
      </div>

      <div class="field-row">
        <label class="field">
          <span class="field__label">Dauer</span>
          <select id="fDuration">
            <option value="15">15 Min</option>
            <option value="30" selected>30 Min</option>
            <option value="45">45 Min</option>
            <option value="60">1 Std</option>
            <option value="90">1,5 Std</option>
            <option value="120">2 Std</option>
            <option value="180">3 Std</option>
            <option value="240">4 Std</option>
          </select>
        </label>
        <label class="field">
          <span class="field__label">Deadline (optional)</span>
          <input type="date" id="fDeadline" />
        </label>
      </div>

      <label class="field field--switch">
        <span>
          <span class="field__label">Fester Tag</span>
          <span class="field__hint">An diesem Tag fixieren, nicht automatisch verschieben</span>
        </span>
        <select id="fFixedDay">
          <option value="">Automatisch</option>
          <option value="0">Montag</option>
          <option value="1">Dienstag</option>
          <option value="2">Mittwoch</option>
          <option value="3">Donnerstag</option>
          <option value="4">Freitag</option>
          <option value="5">Samstag</option>
          <option value="6">Sonntag</option>
        </select>
      </label>

      <div class="sheet__actions">
        <button class="btn btn--ghost" id="sheetCancel">Abbrechen</button>
        <button class="btn btn--primary" id="sheetSave">Speichern</button>
      </div>
      <button class="btn btn--danger-text" id="sheetDelete" hidden>Aufgabe löschen</button>
    </section>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
